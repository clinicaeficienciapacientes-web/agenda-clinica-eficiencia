// ── AVAILABILITY HELPER ─────────────────────────────────────────────────────
function isSlotFree(prof,day,time,scheds){
  if(!prof.days.includes(day))return false;
  if(prof.availSlots&&prof.availSlots[day]&&!prof.availSlots[day].includes(time))return false;
  if(scheds.some(s=>s.profId===prof.id&&s.day===day&&s.time===time))return false;
  if(time==='11:40'&&scheds.some(s=>s.profId===prof.id&&s.day===day&&s.time==='13:00'))return false;
  if(time==='13:00'&&scheds.some(s=>s.profId===prof.id&&s.day===day&&s.time==='11:40'))return false;
  return true;
}
function canCoverSlot(prof,day,time,serviceId,scheds,overrides,dateStr,abSet){
  if(abSet.has(prof.id))return false;
  if(!prof.days.includes(day))return false;
  if(!prof.services||!prof.services.includes(serviceId))return false;
  if(prof.availSlots&&prof.availSlots[day]&&!prof.availSlots[day].includes(time))return false;
  if(scheds.some(s=>s.profId===prof.id&&s.day===day&&s.time===time))return false;
  if(overrides.some(s=>s.profId===prof.id&&s.date===dateStr&&s.time===time))return false;
  if(time==='11:40'&&(scheds.some(s=>s.profId===prof.id&&s.day===day&&s.time==='13:00')||overrides.some(s=>s.profId===prof.id&&s.date===dateStr&&s.time==='13:00')))return false;
  if(time==='13:00'&&(scheds.some(s=>s.profId===prof.id&&s.day===day&&s.time==='11:40')||overrides.some(s=>s.profId===prof.id&&s.date===dateStr&&s.time==='11:40')))return false;
  return true;
}

// ── SLOT MATCHING ALGORITHM ─────────────────────────────────────────────────
function findScheduleOptions(requests,profs,scheds){
  // requests: [{serviceId, freq, fase}]
  // Build free slots per service
  const avail={};
  requests.forEach(req=>{
    avail[req.serviceId]=[];
    profs.forEach(p=>{
      if(!p.services?.includes(req.serviceId))return;
      p.days.forEach(day=>{
        TIMES.forEach(time=>{
          if(!isSlotFree(p,day,time,scheds))return;
          avail[req.serviceId].push({day,time,profId:p.id,profName:p.name,spec:p.spec});
        });
      });
    });
  });
  // Score days by coverage
  const dayScore={};
  DAYS.forEach(d=>{
    dayScore[d]=requests.filter(r=>avail[r.serviceId]?.some(s=>s.day===d)).length;
  });
  const sortedDays=[...DAYS].sort((a,b)=>dayScore[b]-dayScore[a]);
  // Generate one option greedily
  const makeOption=()=>{
    const proposed=[];const used=new Set();
    const remaining={};requests.forEach(r=>{remaining[r.serviceId]=r.freq;});
    const sorted=[...requests].sort((a,b)=>(avail[a.serviceId]?.length||0)-(avail[b.serviceId]?.length||0));
    for(const day of sortedDays){
      for(const req of sorted){
        if(remaining[req.serviceId]<=0)continue;
        const daySlots=avail[req.serviceId]?.filter(s=>s.day===day&&!used.has(s.profId+'_'+day+'_'+s.time))||[];
        if(!daySlots.length)continue;
        // Prefer slot adjacent to already-assigned on this day
        const onDay=proposed.filter(p=>p.day===day);
        let best=daySlots[0];
        if(onDay.length>0){
          const lastIdx=TIMES.indexOf(onDay[onDay.length-1].time);
          best=daySlots.reduce((a,b)=>Math.abs(TIMES.indexOf(a.time)-lastIdx)<=Math.abs(TIMES.indexOf(b.time)-lastIdx)?a:b);
        }
        used.add(best.profId+'_'+day+'_'+best.time);
        proposed.push({...best,serviceId:req.serviceId,fase:req.fase||'regular'});
        remaining[req.serviceId]--;
      }
    }
    return proposed;
  };
  // Generate second option with afternoon priority
  const makeOptionAlt=()=>{
    const proposed=[];const used=new Set();
    const remaining={};requests.forEach(r=>{remaining[r.serviceId]=r.freq;});
    const altTimes=[...TT,...TM];
    const altAvail={};
    requests.forEach(req=>{
      altAvail[req.serviceId]=avail[req.serviceId]?.slice().sort((a,b)=>altTimes.indexOf(a.time)-altTimes.indexOf(b.time))||[];
    });
    const sorted=[...requests].sort((a,b)=>(altAvail[a.serviceId]?.length||0)-(altAvail[b.serviceId]?.length||0));
    for(const day of sortedDays){
      for(const req of sorted){
        if(remaining[req.serviceId]<=0)continue;
        const daySlots=altAvail[req.serviceId]?.filter(s=>s.day===day&&!used.has(s.profId+'_'+day+'_'+s.time))||[];
        if(!daySlots.length)continue;
        const best=daySlots[0];
        used.add(best.profId+'_'+day+'_'+best.time);
        proposed.push({...best,serviceId:req.serviceId,fase:req.fase||'regular'});
        remaining[req.serviceId]--;
      }
    }
    return proposed;
  };
  return[makeOption(),makeOptionAlt()];
}

// ── TAB MONTAR AGENDA ────────────────────────────────────────────────────────
function TabMontar({profs,pats,scheds,saveScheds,notify}){
  const [patName,setPatName]=useState('');
  const [convenio,setConvenio]=useState('');
  const [fase,setFase]=useState('regular');
  const [requests,setRequests]=useState([]);
  const [newReq,setNewReq]=useState({serviceId:'',freq:1});
  const [options,setOptions]=useState(null); // [{day,time,profId,profName,serviceId,fase}]
  const [selOption,setSelOption]=useState(0);
  const [confirmed,setConfirmed]=useState(false);
  const e=React.createElement;

  const addReq=()=>{
    if(!newReq.serviceId)return notify('Selecione o servico','err');
    if(requests.some(r=>r.serviceId===newReq.serviceId))return notify('Servico ja adicionado','err');
    setRequests([...requests,{...newReq,fase}]);
    setNewReq({serviceId:'',freq:1});
    setOptions(null);setConfirmed(false);
  };
  const remReq=(sid)=>{setRequests(requests.filter(r=>r.serviceId!==sid));setOptions(null);setConfirmed(false);};

  const buscar=()=>{
    if(!requests.length)return notify('Adicione ao menos um servico','err');
    const opts=findScheduleOptions(requests,profs,scheds);
    setOptions(opts.filter(o=>o.length>0));
    setSelOption(0);setConfirmed(false);
  };

  const confirmar=()=>{
    if(!patName.trim())return notify('Informe o nome do paciente','err');
    if(!options||!options[selOption]?.length)return notify('Nenhuma opcao selecionada','err');
    const opt=options[selOption];
    const novos=opt.map(s=>({id:uid(),profId:s.profId,patName:patName.trim(),day:s.day,time:s.time,serviceId:s.serviceId,fase:s.fase||fase}));

// ── PIPELINE DE AVALIAÇÃO ────────────────────────────────────────────────────
function addBizDays(dateStr,days){
  if(!dateStr)return null;
  let d=new Date(dateStr+'T12:00:00');let added=0;
  while(added<days){d.setDate(d.getDate()+1);const dow=d.getDay();if(dow!==0&&dow!==6)added++;}
  return d.toISOString().split('T')[0];
}
function daysUntil(dateStr){
  if(!dateStr)return null;
  const today=new Date();today.setHours(0,0,0,0);
  return Math.round((new Date(dateStr+' 00:00')-today)/(864e5));
}
function dlClr(d){
  if(d===null)return null;
  if(d<0)return{bg:'#FEF2F2',tx:'#B91C1C',br:'#FECACA',lb:Math.abs(d)+'d atrasado'};
  if(d===0)return{bg:'#FEF2F2',tx:'#B91C1C',br:'#FECACA',lb:'Vence hoje'};
  if(d<=2)return{bg:'#FFFBEB',tx:'#92400E',br:'#FDE68A',lb:d+'d restante'+(d>1?'s':'')};
  return{bg:'#F0FDF4',tx:'#15803D',br:'#BBF7D0',lb:d+'d restantes'};
}
const STAGES={
  aba_multi:[{id:'pendente',l:'Pendente',c:'#94a3b8'},{id:'anamnese',l:'Anamnese',c:'#0891b2'},{id:'avaliacao',l:'Avaliacao',c:'#7c3aed'},{id:'relatorio',l:'Relatorio/PTS',c:'#d97706'},{id:'devolutiva',l:'Devolutiva',c:'#0d9488'},{id:'concluido',l:'Agenda Final',c:'#16a34a'}],
  neuro:[{id:'pendente',l:'Pendente',c:'#94a3b8'},{id:'anamnese',l:'Anamnese',c:'#0891b2'},{id:'avaliacao',l:'Avaliacao',c:'#9333ea'},{id:'relatorio',l:'Relatorio',c:'#d97706'},{id:'devolutiva',l:'Devolutiva',c:'#0d9488'},{id:'concluido',l:'Concluido',c:'#16a34a'}],

const prevStage=(tipo,cur)=>{const s=STAGES[tipo];const i=s.findIndex(x=>x.id===cur);return i>0?s[i-1].id:cur;};

          e('div',null,e('span',{style:lbl},'Inicio avaliacao'),e('input',{type:'date',value:(form.specSessions[0]?.startDate||''),onChange:ev=>setForm(f=>({...f,specSessions:[{...(f.specSessions[0]||{}),startDate:ev.target.value}]})),style:inp})),

        e('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px'}},
          e('div',null,e('span',{style:lbl},'Previsao devolutiva'),e('input',{type:'date',value:form.devolutivaPreview,onChange:ev=>setForm(f=>({...f,devolutivaPreview:ev.target.value})),style:inp})),
          e('div',null,e('span',{style:lbl},'Data real devolutiva'),e('input',{type:'date',value:form.devolutivaActual,onChange:ev=>setForm(f=>({...f,devolutivaActual:ev.target.value})),style:inp})),
          e('div',{style:{gridColumn:'1/-1'}},e('span',{style:lbl},'Prescricao final (carga horaria)'),e('input',{value:form.prescricao,onChange:ev=>setForm(f=>({...f,prescricao:ev.target.value})),style:inp,placeholder:'Ex: TO 2x/sem + ABA 5x/sem + Fono 2x/sem'}))
        )
      ),
      // Status + notes
      e('div',{style:{display:'grid',gridTemplateColumns:'1fr 2fr',gap:'8px',marginBottom:'10px'}},

        e('div',null,e('span',{style:lbl},'Observacoes'),e('input',{value:form.notes,onChange:ev=>setForm(f=>({...f,notes:ev.target.value})),style:inp,placeholder:'Observacoes adicionais'}))
      ),

        e('button',{onClick:closeForm,style:btn()},'Cancelar'),
        editing!=='new'&&e('button',{onClick:()=>{remove(editing);closeForm();},style:btn({color:'#B91C1C',border:'.5px solid #FECACA'})},'Remover'),

  return e('div',null,

      e('div',{style:{flex:1}},
        e('div',{style:{fontSize:'14px',fontWeight:'700',color:'#0d9488'}},'Pipeline de Avaliacao'),
        e('div',{style:{fontSize:'11px',color:'#64748b'}},recs.length+' paciente(s) em acompanhamento')
      ),
      e('div',{style:{display:'flex',gap:'6px'}},
        ['aba_multi','neuro'].map(t=>e('button',{key:t,onClick:()=>setTipo(t),style:{padding:'5px 12px',borderRadius:'6px',cursor:'pointer',fontSize:'12px',border:'.5px solid '+(tipo===t?'#0d9488':'#e2e8f0'),background:tipo===t?'#0d9488':'white',color:tipo===t?'white':'#64748b',fontWeight:tipo===t?'600':'400'}},t==='aba_multi'?'ABA / Multi':'Neuropsicologica'))

function App() {
  const [tab, setTab] = useState('agenda');
  const [loading, setLoading] = useState(true);
  const [syncing, setSyncing] = useState(false);
  const [profs, setProfs] = useState([]);
  const [pats, setPats] = useState([]);
  const [scheds, setScheds] = useState([]);
  const [abs, setAbs] = useState([]);
  const [overrides, setOverrides] = useState([]);
  const [cancels, setCancels] = useState([]);
  const [pipeline, setPipeline] = useState([]);
  const [selDate, setSelDate] = useState(new Date(2026,4,19));
  const [toast, setToast] = useState(null);

  useEffect(()=>{
    async function init(){
      try{
        const[p,pa,sc,ab,ov,ca,pl]=await Promise.all([
          _fbGet('profs',null),_fbGet('pats',null),_fbGet('scheds',null),
          _fbGet('abs',[]),_fbGet('overrides',[]),_fbGet('cancels',[]),_fbGet('pipeline',[])
        ]);
        const fp=p||P0, fpa=pa||PAT0, fsc=sc||seedScheds();
        if(!p) await _fbSet('profs',fp);
        if(!pa) await _fbSet('pats',fpa);
        if(!sc) await _fbSet('scheds',fsc);
        setProfs(fp);setPats(fpa);setScheds(fsc);
        setAbs(ab);setOverrides(ov);setCancels(ca);setPipeline(pl);
        setLoading(false);
        document.getElementById('syncDot').className='dot';
        document.getElementById('syncLabel').textContent='Firebase ativo — sincronizacao em tempo real';
        _fbListen('profs',v=>setProfs(v));
        _fbListen('pats',v=>setPats(v));
        _fbListen('scheds',v=>setScheds(v));
        _fbListen('abs',v=>setAbs(v));
        _fbListen('overrides',v=>setOverrides(v));
        _fbListen('cancels',v=>setCancels(v));
        _fbListen('pipeline',v=>setPipeline(v));
      }catch(ex){
        setLoading(false);
        document.getElementById('syncDot').className='dot err';
        document.getElementById('syncLabel').textContent='Erro: '+ex.message;
      }
    }
    init();
  },[]);

  const persist=async(k,d,setter)=>{setter(d);setSyncing(true);await _fbSet(k,d);setSyncing(false);};
  const notify=(msg,type)=>showToast(msg,type);
  const selDay=DJ[selDate.getDay()]||'seg';
  const dateStr=selDate.toISOString().split('T')[0];
  const navDate=dir=>{let d=new Date(selDate);do{d.setDate(d.getDate()+dir);}while(d.getDay()===0||d.getDay()===6);setSelDate(d);};
  const shared={profs,pats,scheds,abs,overrides,cancels,selDate,selDay,dateStr,navDate,
    saveProfs:d=>persist('profs',d,setProfs),savePats:d=>persist('pats',d,setPats),
    saveScheds:d=>persist('scheds',d,setScheds),saveAbs:d=>persist('abs',d,setAbs),
    saveOverrides:d=>persist('overrides',d,setOverrides),saveCancels:d=>persist('cancels',d,setCancels),
    pipeline,savePipeline:d=>persist('pipeline',d,setPipeline),notify};

  if(loading) return React.createElement('div',{style:{padding:'60px',textAlign:'center',color:'#64748b',fontSize:'14px'}},'Carregando...');

  const TABS=[{k:'agenda',l:'Agenda do Dia'},{k:'fixa',l:'Agenda Fixa'},{k:'montar',l:'Montar Agenda'},{k:'profs',l:'Profissionais'},{k:'pats',l:'Pacientes'},{k:'pipeline',l:'Pipeline Aval.'},{k:'resumo',l:'Resumo Diario'}];
  const e=React.createElement;
  return e('div',{style:{fontFamily:'system-ui,sans-serif',background:'#f1f5f9',minHeight:'100vh'}},
    e('div',{style:{background:'white',borderBottom:'.5px solid #e2e8f0',padding:'0 16px'}},
      e('div',{style:{display:'flex',alignItems:'center',padding:'10px 0 0',gap:'8px'}},
        e('span',{style:{fontSize:'15px',fontWeight:'700',color:'#0d9488'}},'Agenda Clínica'),
        syncing&&e('span',{style:{fontSize:'10px',color:'#64748b'}},'salvando...')
      ),
      e('div',{style:{display:'flex',gap:'2px',padding:'6px 0 0',overflowX:'auto'}},
        TABS.map(t=>e('button',{key:t.k,onClick:()=>setTab(t.k),style:{padding:'7px 12px',borderRadius:'6px 6px 0 0',cursor:'pointer',fontSize:'12px',fontWeight:tab===t.k?'600':'400',border:'none',borderBottom:tab===t.k?'2.5px solid #0d9488':'2.5px solid transparent',background:tab===t.k?'#f0fdfa':'transparent',color:tab===t.k?'#0d9488':'#64748b',whiteSpace:'nowrap'}},t.l))
      )
    ),
    e('div',{style:{padding:'12px'}},
      tab==='agenda'&&e(TabAgenda,shared),
      tab==='fixa'&&e(TabFixa,shared),
      tab==='montar'&&e(TabMontar,shared),
      tab==='profs'&&e(TabProfs,shared),
      tab==='pats'&&e(TabPats,shared),
      tab==='pipeline'&&e(TabPipeline,shared),
      tab==='resumo'&&e(TabResumo,shared)
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
