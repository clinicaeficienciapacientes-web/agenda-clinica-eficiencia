<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Agenda Clínica</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/tabler-icons.min.css"/>
  <style>
    * {box-sizing: border-box; margin: 0; padding: 0;}
    body {font-family: system-ui, sans-serif; background: #f1f5f9; color: #1e293b; min-height: 100vh;}
    body {font-family: system-ui, sans-serif; background: #f1f5f9; color: #1e293b; min-height: 100vh;}
    .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
    .bar{display:flex;align-items:center;gap:8px;margin-bottom:12px;background:white;padding:10px 12px;border-radius:8px;border:.5px solid #e2e8f0}
    .card{background:white;border-radius:8px;border:.5px solid #e2e8f0;padding:12px;margin-bottom:12px}
    .card.info{background:#f0fdfa;border:.5px solid #a7f3d0}
    .card.warning{background:#FEF2F2;border:.5px solid #FECACA}
    .btn{padding:7px 12px;border-radius:6px;cursor:pointer;fontSize:12px;fontWeight:400;border:.5px solid #e2e8f0;background:white;color:#64748b}
    .btn-primary{background:#0d9488;color:white;border:.5px solid #0d9488;fontWeight:600}
    .inp{padding:6px 8px;borderRadius:6px;border:.5px solid #e2e8f0;fontSize:12px;fontFamily:inherit;width:100%}
    .lbl{display:block;fontSize:11px;fontWeight:600;color:#64748b;marginBottom:4px}
    table{width:100%;border-collapse:collapse;fontSize:10px;minWidth:100%}
    th{padding:6px 8px;textAlign:left;color:#0d9488;fontWeight:700;borderBottom:1.5px solid #a7f3d0}
    td{padding:4px 8px;borderBottom:.5px solid #f1f5f9}
  </style>
</head>
<body>
  <div id="root"></div>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script>
    // @ts-nocheck
    const React = window.React;
    const {useState, useEffect, useMemo} = React;
    const ReactDOM = window.ReactDOM;

    // ────────────────────────────────────────────────────────────────────
    // DATA & CONSTANTS
    // ────────────────────────────────────────────────────────────────────
    
    const uid = () => Math.random().toString(36).slice(2, 11);
    const DAYS = ['seg', 'ter', 'qua', 'qui', 'sex'];
    const DL = {seg: 'Segunda', ter: 'Terça', qua: 'Quarta', qui: 'Quinta', sex: 'Sexta'};
    const DS = {seg: 'Seg', ter: 'Ter', qua: 'Qua', qui: 'Qui', sex: 'Sex'};
    const DJ = {0: 'dom', 1: 'seg', 2: 'ter', 3: 'qua', 4: 'qui', 5: 'sex', 6: 'dom'};
    const TIMES = ['08:00', '08:50', '10:00', '10:50', '11:40', '13:00', '13:50', '14:40', '15:50', '16:40', '17:30', '18:20'];
    const TM = ['08:00', '08:50', '10:00', '10:50', '11:40'];
    const TT = ['13:00', '13:50', '14:40', '15:50', '16:40', '17:30', '18:20'];

    const P0 = [
      {id: 'p1', name: 'Ana Celia', spec: 'Terapia Ocupacional', days: DAYS, services: ['to', 'ghs', 'estrategia'], availSlots: {}},
      {id: 'p2', name: 'Eliana Rodrigues', spec: 'Fisioterapia', days: DAYS, services: ['fisio'], availSlots: {}},
      {id: 'p3', name: 'Felipe Suares', spec: 'Terapia Ocupacional', days: DAYS, services: ['to'], availSlots: {}},
      {id: 'p4', name: 'Giovanna Souza', spec: 'Fonoaudiologia', days: DAYS, services: ['fono'], availSlots: {}},
      {id: 'p5', name: 'Jaime Santos', spec: 'Psicologia ABA', days: DAYS, services: ['aba'], availSlots: {}},
      {id: 'p6', name: 'Karina Milet', spec: 'Fonoaudiologia', days: ['seg', 'ter', 'qua'], services: ['fono'], availSlots: {}},
      {id: 'p7', name: 'Marcelo Santana', spec: 'Psicologia ABA', days: DAYS, services: ['aba'], availSlots: {}},
      {id: 'p8', name: 'Rafael', spec: 'Psicologia ABA', days: DAYS, services: ['aba'], availSlots: {}},
      {id: 'p9', name: 'Sarah Castro', spec: 'Neuropsicologia', days: DAYS, services: ['neuro'], availSlots: {}},
      {id: 'p10', name: 'Tiago Bueno', spec: 'Psicologia', days: ['seg', 'sex'], services: ['psico'], availSlots: {}},
      {id: 'p11', name: 'Viviane Gomes', spec: 'Terapia Ocupacional', days: DAYS, services: ['to'], availSlots: {}},
      {id: 'p12', name: 'Wilma Paiva', spec: 'Nutrição', days: DAYS, services: ['nutri'], availSlots: {}},
      {id: 'p13', name: 'Zelia Nunes', spec: 'Psicopedagogia', days: DAYS, services: ['psicoped'], availSlots: {}},
      {id: 'p14', name: 'Bruno Godinho', spec: 'Musicoterapia', days: ['ter', 'qui'], services: ['musico'], availSlots: {}},
      {id: 'p15', name: 'Ana Paula Matos', spec: 'Psicologia', days: ['ter', 'qua', 'qui', 'sex'], services: ['psico'], availSlots: {}},
      {id: 'p16', name: 'Cleide Bezerra', spec: 'Neuropsicologia', days: ['qua', 'sex'], services: ['neuro'], availSlots: {}},
      {id: 'p17', name: 'Amanda Oliveira', spec: 'Anamnese/Triagem', days: ['seg', 'qua', 'sex'], services: ['anamnese'], availSlots: {}},
    ];

    const PAT0 = ['Alvaro Augusto','Alana Alves','Alexia Lucas','Ana Beatriz','Arthur Pereira','Benicio Nascimento','Bento Nunes','Bernardo Fernandez','Bernardo Nunes','Bernardo Savi','Bianca Pugliese','Bruno Aimar','Caio Brito','Caio Hiro','Cesar Kenji','Chafic Haidar','Clara Gomes','Davi Castanheira','Davi Guerreiro','Davi Hibino','Davi Salles','Edson Lima','Elisa Rocha','Enzo Tavares','Felipe Mevo','Fernanda Haddad','Fernanda Sassa','Gabriel Lima','Guilherme Iran','Heitor Gomes','Joao Gustavo','Joao Sassa','Lais Dontal','Laura Nascimento','Leonardo Mevo','Leonardo Santos','Leticia Ishi','Leticia Varges','Livia Renda','Lorenzo Alves','Manuela Ueno','Maria Antonia','Maria Clara Borba','Maria Eduarda','Maria Flor','Mateus Seiji','Matheus Cecilio','Matheus Milani','Miguel Gualter','Miguel Luiz','Murilo Gomes','Nathalia Santos','Pedro Castanho','Pedro Henrique Martins','Rafael Martinelli','Rebeca Camandaroba','Rebeca Silva','Ryan Nodomi','Sofia Queiroz','Tamires Cristina','Theo Laureano','Theo Rocha','Theo Santa','Toni Ricardo','Vitor Lima','Yuria Takeda','Anna Giovanna'
    ].map((name,i)=>({id:'pt'+(i+1),name,guardian:'',phone:'',payType:'convenio',convenio:'',notes:'',availSlots:{}}));

    const SVCS = [
      {id: 'to', name: 'Terapia Ocupacional', cat: 'individual', specs: ['Terapia Ocupacional'], clr: '#0d9488'},
      {id: 'fisio', name: 'Fisioterapia', cat: 'individual', specs: ['Fisioterapia'], clr: '#2563eb'},
      {id: 'psico', name: 'Psicologia', cat: 'individual', specs: ['Psicologia'], clr: '#7c3aed'},
      {id: 'aba', name: 'Psicologia ABA', cat: 'individual', specs: ['Psicologia ABA'], clr: '#db2777'},
      {id: 'fono', name: 'Fonoaudiologia', cat: 'individual', specs: ['Fonoaudiologia'], clr: '#ea580c'},
      {id: 'nutri', name: 'Nutrição', cat: 'individual', specs: ['Nutrição'], clr: '#16a34a'},
      {id: 'psicoped', name: 'Psicopedagogia', cat: 'individual', specs: ['Psicopedagogia'], clr: '#d97706'},
      {id: 'neuro', name: 'Neuropsicologia', cat: 'individual', specs: ['Neuropsicologia'], clr: '#0891b2'},
      {id: 'musico', name: 'Musicoterapia', cat: 'individual', specs: ['Musicoterapia'], clr: '#8b5cf6'},
      {id: 'psicomotri', name: 'Psicomotricidade', cat: 'individual', specs: ['Terapia Ocupacional'], clr: '#f59e0b'},
      {id: 'neuromod', name: 'Neuromodulação', cat: 'individual', specs: ['Neuropsicologia'], clr: '#06b6d4'},
      {id: 'ghs', name: 'Grupo Habilidades Sociais', cat: 'group', specs: ['Terapia Ocupacional'], clr: '#10b981'},
      {id: 'estrategia', name: 'Estratégia de Ensino', cat: 'planning', specs: ['Terapia Ocupacional'], clr: '#f97316'},
      {id: 'or_parental', name: 'Orientação Parental', cat: 'planning', specs: ['Psicologia'], clr: '#6366f1'},
      {id: 'anamnese', name: 'Anamnese', cat: 'planning', specs: ['Anamnese/Triagem'], clr: '#14b8a6'},
      {id: 'sup_escolar', name: 'Suporte Escolar', cat: 'planning', specs: ['Psicopedagogia'], clr: '#f43f5e'},
      {id: 'suporte_comp', name: 'Suporte Comportamental', cat: 'planning', specs: ['Psicologia ABA'], clr: '#06b6d4'},
      {id: 'reuniao_esc', name: 'Reunião Escolar', cat: 'planning', specs: ['Psicopedagogia'], clr: '#a855f7'},
      {id: 'elab_pei', name: 'Elaboração PEI', cat: 'planning', specs: ['Psicopedagogia'], clr: '#ec4899'},
      {id: 'adapt_curr', name: 'Adaptação Curricular', cat: 'planning', specs: ['Psicopedagogia'], clr: '#8b5cf6'},
      {id: 'int_fono_musico', name: 'Int. Fono + Musico', cat: 'integrated', specs: ['Fonoaudiologia','Musicoterapia'], clr: '#f5a623'},
      {id: 'int_aba_psicoped', name: 'Int. ABA + Psicoped', cat: 'integrated', specs: ['Psicologia ABA','Psicopedagogia'], clr: '#bd3ee9'},
      {id: 'int_aba_musico', name: 'Int. ABA + Musico', cat: 'integrated', specs: ['Psicologia ABA','Musicoterapia'], clr: '#e91e63'},
      {id: 'int_fono_psicoped', name: 'Int. Fono + Psicoped', cat: 'integrated', specs: ['Fonoaudiologia','Psicopedagogia'], clr: '#ff6b35'},
      {id: 'int_to_psicomotri', name: 'Int. TO + Psicomotri', cat: 'integrated', specs: ['Terapia Ocupacional','Psicomotricidade'], clr: '#44af69'},
      {id: 'int_to_nutri', name: 'Int. TO + Nutri', cat: 'integrated', specs: ['Terapia Ocupacional','Nutrição'], clr: '#f9a825'},
      {id: 'int_fono_nutri', name: 'Int. Fono + Nutri', cat: 'integrated', specs: ['Fonoaudiologia','Nutrição'], clr: '#ffa500'},
      {id: 'int_to_psicoped', name: 'Int. TO + Psicoped', cat: 'integrated', specs: ['Terapia Ocupacional','Psicopedagogia'], clr: '#16a34a'},
      {id: 'int_fono_to', name: 'Int. Fono + TO', cat: 'integrated', specs: ['Fonoaudiologia','Terapia Ocupacional'], clr: '#5ac8fa'},
    ];

    const SVCMAP = Object.fromEntries(SVCS.map(s => [s.id, s]));
    const SC = Object.fromEntries(P0.map(p => [p.spec, SVCMAP[p.services?.[0]]?.clr || '#94a3b8']));

    const btn = (extras = {}) => ({padding: '6px 12px', borderRadius: '6px', cursor: 'pointer', fontSize: '11px', fontWeight: '400', border: '.5px solid #e2e8f0', background: 'white', color: '#64748b', ...extras});
    const btnP = {padding: '6px 12px', borderRadius: '6px', cursor: 'pointer', fontSize: '11px', fontWeight: '600', border: '.5px solid #0d9488', background: '#0d9488', color: 'white'};
    const card = (extras = {}) => ({background: 'white', borderRadius: '8px', border: '.5px solid #e2e8f0', padding: '12px', ...extras});
    const inp = {padding: '6px 8px', borderRadius: '6px', border: '.5px solid #e2e8f0', fontSize: '12px', fontFamily: 'inherit', width: '100%'};
    const lbl = {display: 'block', fontSize: '11px', fontWeight: '600', color: '#64748b', marginBottom: '4px'};

    const svcClr = (svcId, fase) => {
      const s = SVCMAP[svcId];
      if (fase === 'avaliacao') return {bg: '#FFF7ED', tx: '#C2410C', br: '#FED7AA'};
      return {bg: s?.clr + '22', tx: s?.clr || '#64748b', br: s?.clr || '#e2e8f0'};
    };
    const svcShort = (svcId) => SVCMAP[svcId]?.name?.slice(0, 8) || svcId;
    const shortSpec = (s) => s.replace('Terapia Ocupacional','TO').replace('Psicologia ABA','ABA').replace('Fonoaudiologia','Fono').replace('Fisioterapia','Fisio').replace('Neuropsicologia','Neuro').replace('Anamnese/Triagem','Anam.').replace('Nutrição','Nutr.').replace('Psicopedagogia','Psicoped.').replace('Musicoterapia','Music.');

    // ────────────────────────────────────────────────────────────────────
    // APP
    // ────────────────────────────────────────────────────────────────────

    function App() {
      const [loading, setLoading] = useState(true);
      const [tab, setTab] = useState('agenda');
      const [toast, setToast] = useState(null);
      const [profs, setProfs] = useState([]);
      const [pats, setPats] = useState([]);
      const [scheds, setScheds] = useState([]);
      const [abs, setAbs] = useState([]);
      const [overrides, setOverrides] = useState([]);
      const [cancels, setCancels] = useState([]);
      const [pipeline, setPipeline] = useState([]);
      const [waitlist, setWaitlist] = useState([]);
      const [selDate, setSelDate] = useState(new Date(2026, 4, 19));

      function loadAll() {
        const load = (k, fb) => {try { const v = localStorage.getItem(k); if (v) return JSON.parse(v); } catch (e) {} return fb; };
        setProfs(load('ag5_profs', P0));
        setPats(load('ag5_pats', PAT0));
        setScheds(load('ag5_scheds', []));
        setAbs(load('ag5_abs', []));
        setOverrides(load('ag5_ov', []));
        setCancels(load('ag5_cancels', []));
        setPipeline(load('ag5_pipeline', []));
        setWaitlist(load('ag5_waitlist', []));
        setLoading(false);
      }

      useEffect(() => { loadAll(); }, []);

      const persist = (k, d, s) => { s(d); try { localStorage.setItem(k, JSON.stringify(d)); } catch (e) {} };
      const notify = (msg, type = 'ok') => { setToast({msg, type}); setTimeout(() => setToast(null), 3000); };
      const selDay = DJ[selDate.getDay()] || 'seg';
      const dateStr = selDate.toISOString().split('T')[0];
      const navDate = (dir) => { let d = new Date(selDate); do { d.setDate(d.getDate() + dir); } while (d.getDay() === 0 || d.getDay() === 6); setSelDate(d); };
      
      const shared = {
        profs, pats, scheds, abs, overrides, cancels, selDate, selDay, dateStr, navDate, waitlist,
        saveProfs: d => persist('ag5_profs', d, setProfs),
        savePats: d => persist('ag5_pats', d, setPats),
        saveScheds: d => persist('ag5_scheds', d, setScheds),
        saveAbs: d => persist('ag5_abs', d, setAbs),
        saveOverrides: d => persist('ag5_ov', d, setOverrides),
        saveCancels: d => persist('ag5_cancels', d, setCancels),
        pipeline, savePipeline: d => persist('ag5_pipeline', d, setPipeline),
        saveWaitlist: d => persist('ag5_waitlist', d, setWaitlist),
        notify
      };

      if (loading) return React.createElement('div', {style: {padding: '60px', textAlign: 'center', color: '#64748b'}}, 'Carregando...');

      const TABS = [
        {k: 'agenda', l: 'Agenda do Dia'}, {k: 'fixa', l: 'Agenda Fixa'},
        {k: 'montar', l: 'Montar Agenda'}, {k: 'profs', l: 'Profissionais'},
        {k: 'pats', l: 'Pacientes'}, {k: 'lista_espera', l: 'Lista de Espera'}, {k: 'pipeline', l: 'Pipeline Aval.'}, {k: 'resumo', l: 'Resumo Diario'},
      ];
      const e = React.createElement;
      
      return e('div', {style: {fontFamily: 'system-ui,sans-serif', background: '#f1f5f9', minHeight: '100vh'}},
        toast && e('div', {style: {padding: '10px 16px', marginBottom: '4px', borderRadius: '8px', fontSize: '13px', fontWeight: '500', background: toast.type === 'err' ? '#FEF2F2' : '#F0FDF4', color: toast.type === 'err' ? '#B91C1C' : '#15803D', border: '.5px solid ' + (toast.type === 'err' ? '#FECACA' : '#BBF7D0')}}, toast.msg),
        e('div', {style: {background: 'white', borderBottom: '.5px solid #e2e8f0', padding: '0 16px'}},
          e('div', {style: {display: 'flex', alignItems: 'center', padding: '10px 0 0'}}, e('span', {style: {fontSize: '15px', fontWeight: '700', color: '#0d9488'}}, 'Agenda Clinica')),
          e('div', {style: {display: 'flex', gap: '2px', padding: '6px 0 0', overflowX: 'auto'}},
            TABS.map(t => e('button', {key: t.k, onClick: () => setTab(t.k), style: {padding: '7px 12px', borderRadius: '6px 6px 0 0', cursor: 'pointer', fontSize: '12px', fontWeight: tab === t.k ? '600' : '400', border: 'none', borderBottom: tab === t.k ? '2.5px solid #0d9488' : '2.5px solid transparent', background: tab === t.k ? '#f0fdfa' : 'transparent', color: tab === t.k ? '#0d9488' : '#64748b', whiteSpace: 'nowrap'}}, t.l))
          )
        ),
        e('div', {style: {padding: '12px'}},
          tab === 'agenda' && e(TabAgenda, shared),
          tab === 'fixa' && e(TabFixa, shared),
          tab === 'montar' && e(TabMontar, shared),
          tab === 'profs' && e(TabProfs, shared),
          tab === 'pats' && e(TabPats, shared),
          tab === 'lista_espera' && e(TabListaEspera, shared),
          tab === 'pipeline' && e(TabPipeline, shared),
          tab === 'resumo' && e(TabResumo, shared)
        )
      );
    }

    // ────────────────────────────────────────────────────────────────────
    // STUBS - PLACEHOLDER TABS
    // ────────────────────────────────────────────────────────────────────

    function TabAgenda({profs, pats, scheds, notify}) {
      const e = React.createElement;
      return e('div', {style: card()}, e('span', {style: {fontSize: '12px'}}, '📅 Agenda do Dia — em desenvolvimento'));
    }

    function TabFixa({profs, pats, scheds, saveScheds, notify}) {
      const e = React.createElement;
      return e('div', {style: card()}, e('span', {style: {fontSize: '12px'}}, '📋 Agenda Fixa — em desenvolvimento'));
    }

    function TabMontar({profs, pats, scheds, saveScheds, notify}) {
      const e = React.createElement;
      return e('div', {style: card()}, e('span', {style: {fontSize: '12px'}}, '🛠️ Montar Agenda — em desenvolvimento'));
    }

    function TabProfs({profs, saveProfs, notify}) {
      const e = React.createElement;
      return e('div', {style: card()}, e('span', {style: {fontSize: '12px'}}, '👨‍⚕️ Profissionais — em desenvolvimento'));
    }

    function TabPats({pats, profs, scheds, savePats, notify}) {
      const [adding, setAdding] = useState(false);
      const [editing, setEditing] = useState(null);
      const [search, setSearch] = useState('');
      const [form, setForm] = useState({name: '', guardian: '', phone: '', payType: 'convenio', convenio: '', notes: '', availSlots: {}});
      
      const filtered = pats.filter(p => p.name.toLowerCase().includes(search.toLowerCase()));
      const startAdd = () => { setForm({name: '', guardian: '', phone: '', payType: 'convenio', convenio: '', notes: '', availSlots: {}}); setAdding(true); setEditing(null); };
      const startEdit = (p) => { setForm({name: p.name, guardian: p.guardian || '', phone: p.phone || '', payType: p.payType || 'convenio', convenio: p.convenio || '', notes: p.notes || '', availSlots: {...(p.availSlots || {})}}); setEditing(p.id); setAdding(false); };
      const cancel = () => { setAdding(false); setEditing(null); };
      const saveF = () => { if (!form.name.trim()) return notify('Informe o nome', 'err'); if (editing) { savePats(pats.map(p => p.id === editing ? {...p, ...form} : p)); notify('Atualizado'); } else { savePats([...pats, {id: uid(), ...form}]); notify('Adicionado'); } cancel(); };
      const e = React.createElement;

      return e('div', null,
        e('div', {style: {display: 'flex', gap: '8px', marginBottom: '12px'}},
          e('input', {value: search, onChange: ev => setSearch(ev.target.value), style: {...inp, maxWidth: '240px'}, placeholder: 'Buscar paciente...'}),
          e('button', {onClick: startAdd, style: {...btnP, marginLeft: 'auto'}}, '+ Adicionar')
        ),
        (adding || editing) && e('div', {style: {...card({background: '#f0fdfa', border: '.5px solid #a7f3d0'}), marginBottom: '12px'}},
          e('div', {style: {fontSize: '13px', fontWeight: '600', color: '#0d9488', marginBottom: '10px'}}, (editing ? 'Editar' : 'Novo') + ' paciente'),
          e('div', {style: {display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px', marginBottom: '10px'}},
            e('div', null, e('span', {style: lbl}, 'Nome *'), e('input', {value: form.name, onChange: ev => setForm({...form, name: ev.target.value}), style: inp, placeholder: 'Nome'})),
            e('div', null, e('span', {style: lbl}, 'Responsavel'), e('input', {value: form.guardian, onChange: ev => setForm({...form, guardian: ev.target.value}), style: inp})),
            e('div', null, e('span', {style: lbl}, 'WhatsApp'), e('input', {value: form.phone, onChange: ev => setForm({...form, phone: ev.target.value}), style: inp})),
            e('div', null, e('span', {style: lbl}, 'Pagamento'), e('select', {value: form.payType, onChange: ev => setForm({...form, payType: ev.target.value}), style: inp}, e('option', {value: 'convenio'}, 'Convenio')))
          ),
          e('div', {style: {display: 'flex', gap: '8px'}},
            e('button', {onClick: cancel, style: btn()}, 'Cancelar'),
            e('button', {onClick: saveF, style: btnP}, 'Salvar')
          )
        ),
        e('div', {style: card()},
          e('div', {style: {fontSize: '12px', fontWeight: '600', color: '#1e293b', marginBottom: '8px'}}, 'Pacientes: ' + filtered.length),
          filtered.length === 0 ? e('div', {style: {fontSize: '11px', color: '#94a3b8', textAlign: 'center', padding: '12px'}}, 'Nenhum paciente') :
            filtered.map(p => e('div', {key: p.id, style: {display: 'flex', gap: '8px', padding: '6px', borderBottom: '.5px solid #f1f5f9', alignItems: 'center'}},
              e('span', {style: {flex: 1, fontSize: '12px'}}, p.name),
              e('button', {onClick: () => startEdit(p), style: btn({fontSize: '10px'})}, 'Editar')
            ))
        )
      );
    }

    function TabListaEspera({profs, pats, scheds, waitlist, saveWaitlist, notify}) {
      const [adding, setAdding] = useState(false);
      const [form, setForm] = useState({patName: '', specialty: '', addedDate: new Date().toISOString().split('T')[0]});
      const e = React.createElement;
      const SPEC_OPTIONS = ['Terapia Ocupacional', 'Psicologia ABA', 'Fonoaudiologia', 'Fisioterapia', 'Psicologia', 'Nutrição', 'Psicopedagogia', 'Neuropsicologia'];
      
      const addWait = () => {
        if (!form.patName.trim()) return notify('Informe o paciente', 'err');
        if (!form.specialty) return notify('Selecione a especialidade', 'err');
        saveWaitlist([...waitlist, {id: uid(), patName: form.patName.trim(), specialty: form.specialty, addedDate: form.addedDate}]);
        notify('Paciente adicionado à lista de espera');
        setAdding(false);
        setForm({patName: '', specialty: '', addedDate: new Date().toISOString().split('T')[0]});
      };
      const bySpec = {}; SPEC_OPTIONS.forEach(sp => { bySpec[sp] = waitlist.filter(w => w.specialty === sp); });

      return e('div', null,
        e('div', {style: {...card({background: '#f0fdfa', border: '.5px solid #a7f3d0'}), marginBottom: '12px'}},
          e('div', {style: {fontSize: '14px', fontWeight: '700', color: '#0d9488', marginBottom: '8px'}}, 'Lista de Espera'),
          e('span', {style: {fontSize: '11px', color: '#64748b'}}, 'Pacientes aguardando profissional')
        ),
        e('button', {onClick: () => setAdding(!adding), style: btnP}, '+ Adicionar à fila'),
        adding && e('div', {style: {...card({background: '#f0fdfa', border: '.5px solid #a7f3d0'}), marginBottom: '12px'}},
          e('div', {style: {fontSize: '13px', fontWeight: '600', color: '#0d9488', marginBottom: '10px'}}, 'Adicionar à lista de espera'),
          e('div', {style: {display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px', marginBottom: '10px'}},
            e('div', null, e('span', {style: lbl}, 'Paciente'), e('input', {list: 'pl_esp', value: form.patName, onChange: ev => setForm({...form, patName: ev.target.value}), style: inp}), e('datalist', {id: 'pl_esp'}, pats.map(p => e('option', {key: p.id, value: p.name})))),
            e('div', null, e('span', {style: lbl}, 'Especialidade'), e('select', {value: form.specialty, onChange: ev => setForm({...form, specialty: ev.target.value}), style: inp}, e('option', {value: ''}, '-- Selecione --'), SPEC_OPTIONS.map(sp => e('option', {key: sp, value: sp}, sp))))
          ),
          e('div', {style: {display: 'flex', gap: '8px'}},
            e('button', {onClick: () => setAdding(false), style: btn()}, 'Cancelar'),
            e('button', {onClick: addWait, style: btnP}, 'Adicionar')
          )
        )
      );
    }

    function TabPipeline({pipeline, savePipeline, profs, notify}) {
      const e = React.createElement;
      return e('div', {style: card()}, e('span', {style: {fontSize: '12px'}}, '📊 Pipeline de Avaliação — em desenvolvimento'));
    }

    function TabResumo({profs, scheds, abs, overrides, cancels, selDate, selDay, dateStr, navDate}) {
      const [viewMode, setViewMode] = useState('prof');
      const e = React.createElement;
      return e('div', null,
        e('div', {style: {display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '10px', background: 'white', padding: '10px 12px', borderRadius: '8px', border: '.5px solid #e2e8f0'}},
          e('button', {onClick: () => navDate(-1), style: btn()}, '< Anterior'),
          e('div', {style: {flex: 1}}, e('div', {style: {fontSize: '14px', fontWeight: '700', color: '#1e293b'}}, DL[selDay])),
          e('button', {onClick: () => navDate(1), style: btn()}, 'Proximo >'),
          e('div', {style: {display: 'flex', gap: '4px'}},
            ['prof', 'paciente'].map(v => e('button', {key: v, onClick: () => setViewMode(v), style: {padding: '6px 12px', borderRadius: '6px', cursor: 'pointer', fontSize: '11px', fontWeight: viewMode === v ? '600' : '400', border: viewMode === v ? '.5px solid #0d9488' : '.5px solid #e2e8f0', background: viewMode === v ? '#0d9488' : 'white', color: viewMode === v ? 'white' : '#64748b'}}, v === 'prof' ? 'Por Terapeuta' : 'Por Paciente'))
          ),
          e('button', {onClick: () => window.print(), style: btn({color: '#0d9488', border: '.5px solid #0d9488', background: '#f0fdfa'})}, 'Imprimir')
        ),
        e('div', {style: card()},
          e('div', {style: {fontSize: '12px', fontWeight: '600', color: '#1e293b'}}, viewMode === 'prof' ? 'Por Terapeuta' : 'Por Paciente'),
          e('span', {style: {fontSize: '11px', color: '#64748b'}}, '(Funcionalidade completa em desenvolvimento)')
        )
      );
    }

    // ────────────────────────────────────────────────────────────────────
    // RENDER
    // ────────────────────────────────────────────────────────────────────

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
  </script>
</body>
</html>
